<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Quest Completer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ══ QUEST WINDOW MODE (fake exe spawned with --quest) ══ -->
  <div id="quest-mode" class="hidden">
    <div class="qw-inner">
      <div class="qw-header">
        <div class="qw-icon">🎮</div>
        <div class="qw-title" id="qw-title">Quest</div>
      </div>
      <div class="qw-status" id="qw-status">Waiting for Discord…</div>
      <div class="qw-progress"><div class="qw-fill" id="qw-fill"></div></div>
      <div class="qw-time" id="qw-time">15:00</div>
      <div class="qw-btns">
        <button class="btn ghost" id="qw-minus">− 30s</button>
        <button class="btn brand" id="qw-plus">+ 30s</button>
      </div>
      <div class="qw-note">Keep this window open until the timer finishes.</div>
    </div>
  </div>

  <!-- ══ MAIN APP ══ -->
  <div id="app" class="hidden">
    <!-- Guild rail -->
    <nav class="rail">
      <div class="rail-logo" title="Discord Quest Completer">🎮</div>
      <div class="rail-nav">
        <button class="rail-item active" data-view="quests" title="Quests">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L15 9 L22 9.5 L16.5 14.5 L18.5 21.5 L12 17.5 L5.5 21.5 L7.5 14.5 L2 9.5 L9 9 Z"/></svg>
        </button>
        <button class="rail-item" data-view="library" title="Library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>
        </button>
        <button class="rail-item" data-view="badges" title="Badges">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M8.2 12.9 7 22l5-3 5 3-1.2-9.1"/></svg>
        </button>
      </div>
      <div class="rail-bottom">
        <button class="rail-item" data-view="settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Discord Quest</span>
        <span class="muted">Completer</span>
      </div>
      <div class="sidebar-scroll">
        <div class="side-section">ACTIVE QUESTS</div>
        <div class="side-quests" id="side-quests"></div>
        <div class="side-section">LIBRARY</div>
        <div class="side-item" data-view="library">
          <span class="side-item-icon">📚</span> Games
          <span class="side-count" id="game-count"></span>
        </div>
        <div class="side-section">BADGES</div>
        <div class="side-item" data-view="badges">
          <span class="side-item-icon">🏅</span> Badges
        </div>
        <div class="side-section">SYSTEM</div>
        <div class="side-item" data-view="settings">
          <span class="side-item-icon">⚙️</span> Settings
        </div>
      </div>
      <div class="sidebar-footer">
        <div class="user">
          <div class="user-avatar">🐟</div>
          <div class="user-meta">
            <div class="user-name">Quest Runner</div>
            <div class="user-status"><span class="dot"></span> farming</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="hash">#</span>
          <span id="topbar-title">quests</span>
        </div>
        <div class="topbar-right">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="global-search" placeholder="Search…" />
          </div>
          <button class="btn brand" id="btn-add">＋ Add Quest</button>
        </div>
      </header>

      <div class="content">
        <section id="view-quests" class="view"></section>
        <section id="view-library" class="view hidden"></section>
        <section id="view-badges" class="view hidden"></section>
        <section id="view-settings" class="view hidden"></section>
      </div>
    </main>
  </div>

  <!-- ══ ADD QUEST MODAL ══ -->
  <div id="modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Add a Quest</h2>
        <button class="icon-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="aq-search">Search game</label>
          <input id="aq-search" class="input" placeholder="Try “EVE Online”…" autocomplete="off" />
        </div>
        <div id="aq-results" class="aq-results"></div>
        <div id="aq-config" class="aq-config hidden">
          <div class="aq-game">
            <div class="aq-game-icon">🎮</div>
            <div>
              <div class="aq-game-name" id="aq-game-name"></div>
              <div class="aq-game-meta" id="aq-game-meta"></div>
            </div>
          </div>
          <div class="field">
            <label for="aq-exes">Executable</label>
            <div id="aq-exes" class="aq-exes"></div>
            <input id="aq-exe-manual" class="input hidden" placeholder="Enter .exe name manually" />
            <div id="aq-warn" class="warn hidden"></div>
          </div>
          <div class="field">
            <label for="aq-minutes">Duration (minutes)</label>
            <div class="dur-row">
              <input id="aq-minutes" class="input dur" type="number" value="15" min="1" max="1440" />
              <span class="hint">+30s Discord detection buffer · up to 24h</span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn brand" id="aq-launch" disabled>▶ Launch Quest</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
