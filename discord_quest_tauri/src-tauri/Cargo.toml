[package]
name = "discord-quest-tauri"
version = "1.0.0"
description = "Discord Quest Completer — Tauri edition"
edition = "2021"

[lib]
name = "discord_quest_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
